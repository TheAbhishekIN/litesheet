[package]
name = "litesheet"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight, fast, privacy-focused spreadsheet with Excel-compatible formulas and Bring-Your-Own-Key AI"
authors = ["The LiteSheet contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheAbhishekIN/litesheet"
readme = "README.md"
keywords = ["spreadsheet", "excel", "xlsx", "csv", "egui"]
categories = ["gui", "science", "visualization"]
exclude = ["docs/screenshots/*", "dist/*"]

[dependencies]
# UI
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"

# Spreadsheet engine and file formats
formualizer = "0.11.1"
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
csv = "1.4.0"
chrono = "0.4.45"

# AI (Bring Your Own Key)
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
keyring = "4.2.0"

# Utilities
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Full debug info for this dependency tree runs to several GB; line tables
# still give usable backtraces.
debug = "line-tables-only"
