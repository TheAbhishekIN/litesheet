name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check [existing issues](../issues) first.
        **Security problems:** please report them privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .xlsx file with …
        2. Select …
        3. Press …
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Example file or formula
      description: If a file triggers the problem, attach a small copy with any private data removed, or paste the formula.
  - type: input
    id: version
    attributes:
      label: LiteSheet version
      placeholder: "0.1.0, or a commit hash if built from source"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, terminal output, the AI provider and model (for AI issues). Never include your API key.
