version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # egui crates must move together.
      egui:
        patterns: ["egui*", "eframe"]
      # Everything else: one weekly PR for minor and patch releases.
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@<version> on purpose.
      - dependency-name: dtolnay/rust-toolchain
